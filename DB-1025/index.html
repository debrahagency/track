<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>طلب يوسف الخلف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Jost:wght@300;400&family=Cormorant+Garamond:wght@300;400&display=swap">
<style>
/* layout: one quiet column like a tailor's work ticket — noir ground, thin rules, sand accents (Debrah identity) */
:root{
  --bg:#10100F; --raised:#1A1917; --line:#2E2C29; --ink:#F1EEE9; --muted:#9C968C;
  --sand:#C8B899; --sand-deep:#B2A484; --on-sand:#10100F;
  --ar:"IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif;
  --lat:"Jost","Futura","Century Gothic",sans-serif;
  --num:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);font-weight:300;font-size:16px;line-height:1.75;direction:rtl;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px 56px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{display:flex;flex-direction:column;line-height:1.1}
.logo b{font-weight:400;font-size:22px;color:var(--ink)}
.logo span,.eyebrow{font-family:var(--lat);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--sand);direction:ltr}
.eyebrow{display:block;margin-bottom:10px}
.rule{height:1px;background:var(--line)}
h1{font-weight:300;font-size:clamp(38px,10vw,54px);line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:10px 0 0}
.prog{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pct{font-family:var(--num);font-weight:300;font-size:72px;line-height:1;color:var(--sand)}
.cur{text-align:left}
.cur small{display:block;font-size:12px;color:var(--muted)}
.cur b{font-weight:400;font-size:18px}
.bar{height:2px;background:var(--line);margin-top:18px}
.bar i{display:block;height:2px;background:var(--sand)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.fact{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fact:nth-child(odd){padding-left:16px;border-left:1px solid var(--line)}
.fact:nth-child(even){padding-right:16px}
.fact small{font-size:12px;color:var(--muted)}
.fact b{font-weight:400;font-size:18px}
.fact .n{font-family:var(--num);font-size:30px;line-height:1.1;color:var(--sand);direction:ltr;text-align:right}
.ask{padding:20px 22px;display:flex;gap:14px;align-items:flex-start}
.ask.ok{background:var(--raised);border:1px solid var(--line)}
.ask.need{background:var(--sand);color:var(--on-sand)}
.ask .m{width:8px;height:8px;margin-top:10px;flex-shrink:0;background:var(--sand)}
.ask.need .m{background:var(--on-sand)}
.ask b{display:block;font-weight:500}
.ask p{margin:0;font-size:14px;opacity:1}
.ask.ok p{color:var(--muted)}
.stages{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.st .no{font-family:var(--num);font-size:24px;line-height:1;color:var(--line)}
.st.done .no{color:var(--sand-deep)}
.st.now .no{color:var(--sand)}
.st .nm{font-weight:400}
.st.next .nm{color:var(--muted);font-weight:300}
.st .nt{display:block;font-size:13px;color:var(--muted)}
.st .dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.st.done .dt::before{content:"✓  ";color:var(--sand)}
.st.now{position:relative}
.st.now .nm{color:var(--sand)}
.tag{font-family:var(--lat);font-size:10px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--sand);color:var(--sand);padding:3px 8px;direction:ltr}
.foot{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-size:13px;color:var(--muted)}
.ph{direction:ltr;unicode-bidi:embed;user-select:all;color:var(--ink);font-family:var(--lat);letter-spacing:.06em}
.copy{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:2px;cursor:pointer}
.copy:focus-visible{outline:1px solid var(--sand);outline-offset:2px}
.demo{font-size:12px;text-align:center;color:var(--sand);border:1px dashed var(--line);padding:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== بيانات الطلب — هذا الجزء الوحيد اللي يتغيّر ===== */
const ORDER = {
  demo: false,
  id: "DB-1025",
  client: "يوسف الخلف",
  item: "هودي بتطريز عودي",
  pieces: 60,
  delivery: "يُحدَّد بعد اعتماد العينة",
  updated: "29 أكتوبر 2026",
  ask: null,
  stages: [
    {name:"اعتماد التصميم والمقاسات", status:"now", note:"بدأنا تجهيز طلبك"},
    {name:"توفير الخامة", status:"next"},
    {name:"تجهيز العينة واعتمادها", status:"next"},
    {name:"قص القماش", status:"next"},
    {name:"التطريز باللون العودي", status:"next"},
    {name:"الخياطة والتجميع", status:"next"},
    {name:"فحص الجودة", status:"next"},
    {name:"الكي والتغليف", status:"next"},
    {name:"الشحن", status:"next"},
    {name:"التسليم", status:"next"}
  ]
};
const CONTACT = "+966 5X XXX XXXX";
/* ======================================================= */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const total=ORDER.stages.length, done=ORDER.stages.filter(s=>s.status==="done").length;
const now=ORDER.stages.find(s=>s.status==="now");
const pct=Math.round(((done+(now?0.5:0))/total)*100);
const delivered=done===total;

document.getElementById("app").innerHTML=`
${ORDER.demo?'<div class="demo">طلب تجريبي — للمعاينة فقط</div>':''}
<header class="top">
  <div class="logo"><b>وكالة دِبْرَة</b><span>Debrah Agency</span></div>
  <span class="eyebrow" style="margin:0">Order #${esc(ORDER.id)}</span>
</header>
<section>
  <span class="eyebrow">Order Tracking</span>
  <h1>تابع طلبك يا ${esc(ORDER.client.split(" ")[0])}</h1>
  <p class="lead">آخر تحديث ${esc(ORDER.updated)}</p>
</section>
<section>
  <div class="prog">
    <span class="pct">${pct}%</span>
    <div class="cur"><small>${delivered?"الحالة":"المرحلة الحالية"}</small><b>${delivered?"تم التسليم":esc(now?now.name:"")}</b></div>
  </div>
  <div class="bar" role="progressbar" aria-label="نسبة الإنجاز" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
</section>
<section class="facts">
  <div class="fact"><small>المنتج</small><b>${esc(ORDER.item)}</b></div>
  <div class="fact"><small>عدد القطع</small><span class="n">${ORDER.pieces}</span></div>
  <div class="fact"><small>رقم الطلب</small><span class="n">${esc(ORDER.id)}</span></div>
  <div class="fact"><small>التسليم المتوقع</small><b>${esc(ORDER.delivery)}</b></div>
</section>
${ORDER.ask
 ?`<div class="ask need"><span class="m"></span><div><b>${esc(ORDER.ask.title)}</b><p>${esc(ORDER.ask.text)}</p></div></div>`
 :`<div class="ask ok"><span class="m"></span><div><b>ما نحتاج منك شي حالياً</b><p>طلبك بين أيادٍ أمينة، ونحدّث الصفحة مع كل مرحلة.</p></div></div>`}
<section>
  <span class="eyebrow">Production</span>
  <ol class="stages">
  ${ORDER.stages.map((s,i)=>`<li class="st ${s.status}">
     <span class="no">${pad(i+1)}</span>
     <div><span class="nm">${esc(s.name)}</span>${s.note?`<span class="nt">${esc(s.note)}</span>`:""}</div>
     ${s.status==="now"?'<span class="tag">Now</span>':`<span class="dt">${s.status==="done"?esc(s.date||""):""}</span>`}
   </li>`).join("")}
  </ol>
</section>
<footer class="foot">
  <div class="rule" style="width:80px"></div>
  <span>لأي استفسار تواصل معنا واتساب</span>
  <span class="ph" id="ph">${esc(CONTACT)}</span>
  <button class="copy" id="cp" type="button">نسخ الرقم</button>
  <span>نصمّم. نصنع. نسلّم. · المدينة المنورة</span>
</footer>`;

document.getElementById("cp").addEventListener("click",async e=>{
  try{await navigator.clipboard.writeText(CONTACT);e.target.textContent="تم النسخ"}
  catch{const r=document.createRange();r.selectNodeContents(document.getElementById("ph"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
});
</script>
</body>
</html>
